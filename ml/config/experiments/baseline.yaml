name: yolo-baseline-640
description: Reproducible transfer-learning baseline for the twelve equipment classes.
base_model: yolo11s.pt
image_size: 640
epochs: 80
batch_size: 16
patience: 15
workers: 4
device: auto
seed: 20260919
deterministic: true
amp: true
cache: false
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
export:
  format: onnx
  dynamic: true
  simplify: true
promotion_gate:
  map50_95_min: 0.35
  precision_min: 0.55
  recall_min: 0.50
  max_regression_from_champion: 0.03
