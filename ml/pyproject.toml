[project]
name = "sitewatch-ml"
version = "0.1.0"
description = "Reproducible computer-vision experiments for SiteWatch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "mlflow-skinny>=3.15,<4",
  "pillow>=12,<13",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "pyyaml>=6.0.3,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.21,<1",
]

[project.optional-dependencies]
data = [
  "dvc-s3>=3.2,<4",
]
orchestration = [
  "dagster>=1.12,<2",
  "dagster-postgres>=0.28,<1",
  "dagster-webserver>=1.12,<2",
]
train = [
  "onnx>=1.20,<2",
  "onnxruntime>=1.23,<2",
  "torch>=2.9,<3",
  "ultralytics>=8.4.120,<9",
]

[dependency-groups]
dev = [
  "pyright>=1.1.408,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]

[project.scripts]
sitewatch-ml = "sitewatch_ml.cli:app"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitewatch_ml"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov=sitewatch_ml --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["src/sitewatch_ml/orchestration"]
reportMissingTypeStubs = false
reportMissingImports = false
reportPrivateImportUsage = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
