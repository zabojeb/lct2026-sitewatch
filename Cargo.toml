[workspace]
members = [
  "apps/api",
  "apps/schedule",
  "apps/deviations",
  "crates/contracts",
  "crates/domain",
  "crates/platform",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["LCT 2026 Team"]

[workspace.dependencies]
anyhow = "1.0.100"
async-nats = "0.50.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
redis = { version = "1.7.0", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
