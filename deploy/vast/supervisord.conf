; Paths are relative to this file's directory (supervisord's %(here)s).
[supervisord]
logfile=%(here)s/../../logs/supervisord.log
pidfile=%(here)s/../../logs/supervisord.pid
childlogdir=%(here)s/../../logs

[unix_http_server]
file=%(here)s/../../logs/supervisor.sock

[supervisorctl]
serverurl=unix://%(here)s/../../logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:inference]
directory=%(here)s/../../apps/inference
command=%(here)s/../../apps/inference/.venv/bin/uvicorn sitewatch_inference.app:create_app --factory --host 127.0.0.1 --port 8083 --workers 1
environment=DETECTOR_WEIGHTS_640="%(here)s/../../models/sitewatch-v2/yolo_640.pt",DETECTOR_WEIGHTS_960="%(here)s/../../models/sitewatch-v2/yolo_960.pt",CLASSIFIER_WEIGHTS="%(here)s/../../models/sitewatch-v2/convnext_small_latest.pth",REJECT_THRESHOLD_FILE="%(here)s/../../models/sitewatch-v2/reject_threshold.json",INFERENCE_DEVICE="auto",INFERENCE_THREADS="4",YOLO_CONFIG_DIR="/tmp",PYTHONUNBUFFERED="1"
autorestart=true
startsecs=5
stopasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/inference.log
stdout_logfile_maxbytes=20MB

[program:deviations]
command=%(here)s/../../target/release/sitewatch-deviations
environment=DEVIATIONS_HTTP_ADDR="127.0.0.1:8084"
autorestart=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/deviations.log
stdout_logfile_maxbytes=20MB

[program:web]
directory=%(here)s/../../apps/web
command=/opt/node/bin/node build
environment=NODE_ENV="production",HOST="0.0.0.0",PORT="3000",BODY_SIZE_LIMIT="13M",INFERENCE_DEMO_ENABLED="true",INFERENCE_URL="http://127.0.0.1:8083",DEVIATIONS_URL="http://127.0.0.1:8084"
autorestart=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/web.log
stdout_logfile_maxbytes=20MB
