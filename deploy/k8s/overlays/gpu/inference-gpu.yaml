apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: sitewatch
spec:
  template:
    spec:
      containers:
        - name: inference
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
