apiVersion: batch/v1
kind: Job
metadata:
  name: schedule-provision-nats-v1
  namespace: sitewatch
  labels:
    app.kubernetes.io/name: schedule
    app.kubernetes.io/component: provisioning
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: sitewatch-schedule
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision-nats
          image: ghcr.io/sitewatch/schedule:0.1.0
          command: ["/usr/local/bin/schedule-provision-nats"]
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: sitewatch-schedule-secrets
                  key: NATS_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
