apiVersion: v1
kind: ConfigMap
metadata:
  name: sitewatch-config
data:
  APP_ENV: production
  APP_NAME: sitewatch
  HTTP_ADDR: 0.0.0.0:8080
  RUST_LOG: sitewatch_api=info,tower_http=info,sqlx=warn,async_nats=warn
  S3_REGION: ru-central-1
  S3_BUCKET: sitewatch-evidence
  S3_FORCE_PATH_STYLE: "false"
  PUBLIC_API_BASE_URL: /api
  BODY_SIZE_LIMIT: 13M
  ORIGIN: http://sitewatch.local
  INFERENCE_DEMO_ENABLED: "false"
  INFERENCE_URL: http://inference:8083
  DEVIATIONS_URL: http://deviations:8084
