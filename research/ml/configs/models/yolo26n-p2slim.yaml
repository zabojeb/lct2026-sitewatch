# YOLO26-P2slim — детект на P2/4, P3/8, P4/16. Голова P5/32 убрана.
#
# Мотивация замером: медианный объект в кадрах ДГП ~35 px (3 % ширины кадра).
# На stride 32 такой объект занимает ~1 ячейку сетки — уровень P5 для него бесполезен,
# но стоит FLOPs и добавляет кандидатов, которые NMS-free голова всё равно душит.
# P5 остаётся в backbone (SPPF + C2PSA дают глобальный контекст в шею), но своей
# ветви детекта не имеет.
#
# Проверяемая гипотеза: при доле крупных объектов < ~5 % отказ от P5-головы
# не роняет mAP, но снижает GFLOPs и латентность на CPU. Если после разметки
# окажется, что башенных кранов и близких экскаваторов много — вариант отбрасываем.

nc: 16
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10   <- глобальный контекст сохраняем

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16)

  - [[19, 22, 25], 1, Detect, [nc]] # Detect(P2, P3, P4)
