[project]
name = "sitewatch-inference"
version = "0.1.0"
description = "Private detector and crop-classifier serving for SiteWatch"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "opencv-python==5.0.0.93",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
serve = ["torch==2.10.0", "torchvision==0.25.0", "ultralytics==8.4.160"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitewatch_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]
